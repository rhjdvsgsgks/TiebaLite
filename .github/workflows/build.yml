name: Build, Deploy

on:
  workflow_dispatch:
  push:
    branches: [ "master", "4.0-dev" ]
  pull_request:
    branches: [ "master", "4.0-dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "zulu"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Read Output Metadata
        if: ${{ success() }}
        id: read_output_metadata
        uses: juliangruber/read-file-action@v1
        with:
          path: ${{ github.workspace }}/app/build/outputs/apk/debug/output-metadata.json

      - name: Upload Package
        if: ${{ success() }}
        env:
          output_file: ${{ fromJSON(steps.read_output_metadata.outputs.content).elements[0].outputFile }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ env.output_file }}
          path: ${{ github.workspace }}/app/build/outputs/apk/debug/${{ env.output_file }}
